<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Celano Lab Metrology Toolkit</title>
    <meta
      name="description"
      content="Internal working site for Celano Lab — docs and lab tools."
    />
    <link rel="icon" href="assets/apiface.svg" type="image/svg+xml" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind (Play CDN — no build step) -->
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              maroon: {
                50: "#fdf3f6",
                100: "#fbe6ec",
                500: "#c4324f",
                600: "#a72540",
                700: "#8c1d40",
                800: "#6c1531",
                900: "#4d0e22",
              },
              ink: {
                50: "#f7f7f8",
                100: "#eeeef1",
                200: "#d9dae0",
                300: "#b6b8c3",
                400: "#8d8fa0",
                500: "#6a6c7d",
                600: "#4e5060",
                700: "#3a3b48",
                800: "#25262f",
                900: "#141519",
              },
            },
            fontFamily: {
              sans: ["Inter", "ui-sans-serif", "system-ui", "-apple-system", "sans-serif"],
              mono: ["JetBrains Mono", "ui-monospace", "SFMono-Regular", "monospace"],
            },
          },
        },
      };
    </script>

    <!-- Markdown + sanitizer -->
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>

    <!-- ZIP builder (image-compare "save pair to repo" download) -->
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body class="h-full bg-white text-ink-900 font-sans antialiased">
    <div id="app" class="min-h-full flex flex-col"></div>
    <script src="assets/app.js" type="module"></script>
  </body>
</html>
